[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "easy-scrcpy"
version = "0.3.2"
description = "Cross-platform tray companion for scrcpy"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.8,<7",
    "qrcode[pil]>=8,<9",
    "windows-toasts>=1.3.1,<2; sys_platform == 'win32'",
    "pyobjc-framework-UserNotifications>=11; sys_platform == 'darwin'",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.11", "Pillow>=11"]

[project.gui-scripts]
easy-scrcpy = "easy_scrcpy.app:main"

[tool.setuptools.packages.find]
where = ["src"]
