name: Build bundled apps

on: workflow_dispatch

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux Qt runtime dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0
      - run: python -m pip install -e ".[build]"
      - run: python -m unittest discover -s tests -v
      - run: python -m PyInstaller --noconfirm packaging/EasyScrcpy.spec
      - name: Archive macOS app preserving executable permissions
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/EasyScrcpy.app dist/EasyScrcpy-macos.zip
      - name: Archive Linux app preserving executable permissions
        if: runner.os == 'Linux'
        run: tar -czf dist/EasyScrcpy-linux.tar.gz -C dist EasyScrcpy
      - uses: actions/upload-artifact@v4
        with:
          name: EasyScrcpy-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/EasyScrcpy/**
